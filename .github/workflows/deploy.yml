name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          # Copy ALL standalone files including dotfiles (.next folder)
          cp -r .next/standalone/. deploy/
          # Copy static files into the .next folder
          cp -r .next/static deploy/.next/static
          # Copy public folder
          cp -r public deploy/public
          # Verify BUILD_ID exists
          cat deploy/.next/BUILD_ID

      - name: Fix build paths for cPanel server
        run: |
          BUILD_DIR="$(pwd)"
          SERVER_DIR="/home/vizionforge1/vizionforge"
          echo "Build dir: $BUILD_DIR"
          echo "Server dir: $SERVER_DIR"
          echo "=== BEFORE path fix ==="
          grep -o 'outputFileTracingRoot[^,]*' deploy/server.js || echo "outputFileTracingRoot not found in server.js"
          grep -o 'outputFileTracingRoot[^,]*' deploy/.next/required-server-files.json || echo "outputFileTracingRoot not found in json"
          node -e "
          const fs = require('fs');
          const buildDir = process.argv[1];
          const serverDir = process.argv[2];
          const files = ['deploy/server.js', 'deploy/.next/required-server-files.json'];
          for (const file of files) {
            let content = fs.readFileSync(file, 'utf8');
            const count = content.split(buildDir).length - 1;
            console.log(file + ': found ' + count + ' occurrences of build path');
            content = content.replaceAll(buildDir, serverDir);
            fs.writeFileSync(file, content);
            console.log(file + ': replaced ' + buildDir + ' -> ' + serverDir);
          }
          " "$BUILD_DIR" "$SERVER_DIR"
          echo "=== AFTER path fix ==="
          grep -o 'outputFileTracingRoot[^,]*' deploy/server.js
          echo "=== First 5 lines of deploy/server.js ==="
          head -5 deploy/server.js
          echo "=== Checking startServer usage ==="
          grep -c 'startServer' deploy/server.js && echo "OK: uses startServer" || echo "WARNING: startServer not found!"

      - name: Add Passenger .htaccess for cPanel
        run: cp deploy.htaccess deploy/.htaccess

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./deploy/
          server-dir: ./
          dangerous-clean-slate: true

      - name: Verify site is responding
        run: |
          echo "Waiting 30s for deployment to settle..."
          sleep 30
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 https://vizionforge.com || echo "000")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "::warning::Site did not respond - may still be starting up"
          elif [ "$STATUS" -ge 500 ]; then
            echo "::error::Site returned HTTP $STATUS - check Passenger logs in cPanel"
            exit 1
          else
            echo "Site is up (HTTP $STATUS)"
          fi
